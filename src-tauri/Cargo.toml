[package]
name = "skills-hub"
version = "0.1.5"
description = "Local AI agent skills manager"
authors = ["Skills Hub Contributors"]
edition = "2021"

[package.metadata.tauri-winres]

[lib]
name = "skills_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
