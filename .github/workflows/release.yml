name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-installers:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            os: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles dmg"
          - label: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
          - label: Windows
            os: windows-latest
            args: "--bundles nsis,msi"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify Tauri bundle resources
        shell: bash
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          git rev-parse --short HEAD
          git ls-files --error-unmatch src-tauri/tauri.conf.json
          git ls-files --error-unmatch src-tauri/icons/icon.ico
          git ls-files --error-unmatch src-tauri/icons/icon.icns
          git ls-files --error-unmatch src-tauri/icons/icon.png
          test -f src-tauri/icons/icon.ico
          test -f src-tauri/icons/icon.icns
          test -f src-tauri/icons/icon.png
          ls -la src-tauri/icons

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Skills Hub ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Desktop installers for Skills Hub.

            These builds are unsigned. On macOS or Windows you may see a security warning on first launch.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          assetNamePattern: "Skills-Hub-[version]-[platform]-[arch]-[bundle][setup][ext]"
